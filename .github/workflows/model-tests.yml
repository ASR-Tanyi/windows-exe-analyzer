name: Analysis model tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/model-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/model-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        decoder: [LLVM, CAPSTONE]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ python3 python3-venv clang-18 lld-18 llvm-18-dev
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DWEA_DECODER=${{ matrix.decoder }} \
            -DWEA_LLVM_LIBRARY=/usr/lib/llvm-18/lib/libLLVM.so \
            -DWEA_CLANG=/usr/bin/clang-18 -DWEA_LLD_LINK=/usr/bin/lld-link-18 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Run native and report-contract tests
        run: |
          node --version
          ctest --test-dir build --output-on-failure
          python3 -m unittest discover -s tests -p 'test_report_site.py' -v
      - name: Install browser test dependencies
        run: |
          python3 -m venv build/browser-env
          build/browser-env/bin/python -m pip install playwright==1.57.0
          build/browser-env/bin/python -m playwright install --with-deps chromium
      - name: Check HTML navigation and compatibility
        run: |
          build/browser-env/bin/python tests/test_browser.py --fixtures build/test-fixtures
          build/browser-env/bin/python tests/test_data_browser.py build/windows-exe-analyzer --fixtures build/test-fixtures
          build/browser-env/bin/python tests/test_model_browser.py --fixtures build/test-fixtures
          build/browser-env/bin/python tests/test_exception_browser.py build/windows-exe-analyzer
          build/browser-env/bin/python tests/test_unwind_browser.py build/windows-exe-analyzer
          build/browser-env/bin/python tests/test_tls_browser.py build/windows-exe-analyzer
          build/browser-env/bin/python tests/test_function_browser.py --fixtures build/test-fixtures --document-navigation
          build/browser-env/bin/python tests/test_cfg_browser.py --fixtures build/test-fixtures
          build/browser-env/bin/python tests/test_string_browser.py build/windows-exe-analyzer --document-navigation
          build/browser-env/bin/python tests/test_operand_browser.py build/windows-exe-analyzer
      - name: Retain test evidence and roadmap snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: analysis-test-evidence-${{ matrix.decoder }}-${{ github.sha }}
          path: |
            build/Testing/Temporary/LastTest.log
            build/test-fixtures/demo64.html
            build/test-fixtures/demo32.html
            plan.md
          retention-days: 7
          if-no-files-found: warn
